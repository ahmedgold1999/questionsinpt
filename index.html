<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبار الوطني - عمر مثنى</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #D4AF37;
            --bg: #020c1b;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent: #64ffda;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #112240 0%, #020c1b 100%);
            color: #ccd6f6;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container { max-width: 900px; margin: 0 auto; }

        header {
            text-align: center;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--gold);
            margin-bottom: 40px;
        }

        header h1 { color: var(--gold); font-size: 2.2rem; margin-bottom: 5px; }

        /* شريط التحكم */
        .toolbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            position: sticky;
            top: 20px;
            z-index: 100;
            background: rgba(2, 12, 27, 0.8);
            padding: 15px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 25px;
            border: 1px solid transparent;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
            background: var(--card-bg);
            color: white;
        }

        .btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
        .btn:hover:not(.active) { border-color: var(--gold); color: var(--gold); }

        .btn-action { background: none; color: var(--accent); border: 1px solid var(--accent); }
        .btn-action:hover { background: var(--accent); color: #000; }

        /* كرت السؤال */
        .q-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border-right: 4px solid var(--gold);
            animation: fadeIn 0.5s ease forwards;
        }

        .q-text { font-size: 1.25rem; color: #fff; margin-bottom: 20px; display: block; }

        .options-list { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .opt {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .opt:hover { background: rgba(255,255,255,0.08); border-color: var(--gold); }
        .opt.correct { background: #27ae60 !important; color: white; border-color: #2ecc71; }
        .opt.wrong { background: #c0392b !important; color: white; border-color: #e74c3c; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media print {
            .toolbar, .no-print { display: none !important; }
            body { background: #fff; color: #000; padding: 0; }
            .q-card { border: 1px solid #000; background: none; color: #000; page-break-inside: avoid; }
            .q-text, .opt { color: #000; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fas fa-microchip"></i> بوابة الاختبارات الذكية</h1>
        <p>إعداد المهندس: عمر مثنى</p>
    </header>

    <nav class="toolbar">
        <button class="btn active" onclick="changeSubject('arabic', this)">العربية</button>
        <button class="btn" onclick="changeSubject('computer_ar', this)">الحاسوب</button>
        <button class="btn" onclick="changeSubject('english', this)">الإنجليزية</button>
        <div style="border-right: 1px solid #444; margin: 0 10px;"></div>
        <button class="btn btn-action" onclick="window.print()"><i class="fas fa-print"></i></button>
        <button class="btn btn-action" onclick="downloadCurrentJSON()"><i class="fas fa-file-export"></i></button>
    </nav>

    <div id="quiz-load-status" style="text-align:center; margin-bottom: 20px; color: var(--gold);"></div>
    <div id="main-content"></div>
</div>

<script>
    let currentQuestions = [];

    // دالة لجلب الملفات الخارجية
    async function fetchQuestions(fileName) {
        const status = document.getElementById('quiz-load-status');
        const content = document.getElementById('main-content');
        
        status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تحميل الأسئلة...';
        content.innerHTML = '';

        try {
            const response = await fetch(`${fileName}.json`);
            if (!response.ok) throw new Error('لم يتم العثور على الملف');
            const data = await response.json();
            currentQuestions = data.questions;
            renderQuiz();
            status.innerHTML = `تم تحميل ${currentQuestions.length} سؤال بنجاح`;
        } catch (error) {
            status.innerHTML = `<span style="color:red">خطأ: تأكد من وجود ملف ${fileName}.json في نفس المسار</span>`;
            console.error(error);
        }
    }

    function renderQuiz() {
        const content = document.getElementById('main-content');
        currentQuestions.forEach((q, i) => {
            const div = document.createElement('div');
            div.className = 'q-card';
            div.innerHTML = `
                <span class="q-text">${i + 1}. ${q.question}</span>
                <div class="options-list">
                    ${q.options.map(opt => `<div class="opt" onclick="verify(this, '${opt}', '${q.answer}')">${opt}</div>`).join('')}
                </div>
            `;
            content.appendChild(div);
        });
    }

    function verify(el, selected, correct) {
        const options = el.parentElement.querySelectorAll('.opt');
        options.forEach(o => o.style.pointerEvents = 'none');

        if (selected === correct) {
            el.classList.add('correct');
        } else {
            el.classList.add('wrong');
            options.forEach(o => { if(o.innerText === correct) o.classList.add('correct'); });
        }
    }

    function changeSubject(file, btn) {
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        fetchQuestions(file);
    }

    function downloadCurrentJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({questions: currentQuestions}, null, 2));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "exported_quiz.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }

    // التحميل الأولي
    window.onload = () => fetchQuestions('arabic');
</script>

</body>
</html>
